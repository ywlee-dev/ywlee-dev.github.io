<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개념 그림 모음</title>
<style>
  :root { --bg: #fafaf8; --card: #ffffff; --text: #1f1f1d; --muted: #6b6a65; --line: #d8d6ce; --link: #185FA5; --accent: #D85A30; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1a; --card: #262624; --text: #ecebe6; --muted: #a8a69e; --line: #44443f; --link: #85B7EB; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 40px 16px 48px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; color: var(--text); text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  .ico { font-size: 34px; line-height: 1; }
  .name { font-size: 18px; font-weight: 700; margin: 10px 0 4px; color: var(--link); }
  .desc { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>개념 그림 모음</h1>
  <p class="lead">어려운 개념을 만져 보면 바로 바뀌는 그림으로 정리한 곳.</p>
  <div class="cards">
    <a class="card" href="usv-concepts/">
      <div class="ico">🚤</div>
      <div class="name">무인선 운항</div>
      <div class="desc">관제 화면의 조작기와 운항상태 — 버킷 · 스러스터 · 조향 · 엔진 · 조종권</div>
    </a>
    <a class="card" href="usv-concepts/network/">
      <div class="ico">🌐</div>
      <div class="name">네트워크</div>
      <div class="desc">모뎀 · 공유기 · 스위치, IP · 포트포워딩 · DNS, 구멍(COM · USB · 랜 · CAN) · 신호 · 약속</div>
    </a>
    <a class="card" href="english-verb-concepts/">
      <div class="ico">📘</div>
      <div class="name">영어 동사</div>
      <div class="desc">RESULT + HOW + TARGET — 같은 결과를 어떤 방식으로 내는지 그림으로</div>
    </a>
    <a class="card" href="app-structure/">
      <div class="ico">🧠</div>
      <div class="name">앱 구조 기초</div>
      <div class="desc">뇌 · 배선과 룰 · 몸(장비) — 켤 때 누가 무엇을 깨우고, 일이 생기면 어디서 끝나나</div>
    </a>
  </div>
</main>
</body>
</html>
